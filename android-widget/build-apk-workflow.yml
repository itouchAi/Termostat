# Bu dosya GitHub Actions ile bulutta APK derlemek içindir.
# GitHub web arayüzünde repo açtıktan sonra isterseniz:
# "Add file > Create new file" deyip yolu:
# .github/workflows/build-apk.yml
# olarak belirleyip bu içeriği yapıştırabilirsiniz.

name: Build Android APK (Online Cloud Build)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Copy Custom Widget Files to Android Project
        run: |
          mkdir -p android/app/src/main/java/com/termobot/app
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/xml
          cp -f android-widget/ThermostatWidget.kt android/app/src/main/java/com/termobot/app/ || true
          cp -f android-widget/res/layout/widget_thermostat.xml android/app/src/main/res/layout/ || true
          cp -f android-widget/res/xml/thermostat_widget_info.xml android/app/src/main/res/xml/ || true

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK as Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermoBot-Akilli-Termostat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
