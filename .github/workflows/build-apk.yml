name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Add Android Platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK and Patch Configs
        run: |
          # 1. SDK dizinini ayarla
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          
          # 2. SDK 36 yerine kurulu olan SDK 34'e ayarla (Hata onleme)
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/compileSdkVersion = 36/compileSdkVersion = 34/g' android/variables.gradle
            sed -i 's/targetSdkVersion = 36/targetSdkVersion = 34/g' android/variables.gradle
          fi

          # 3. AndroidManifest dosyasindaki eksik provider kapatma etiketini otomatik onar
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f:
              content = f.read()
          if '<provider' in content and '</provider>' not in content:
              content = content.replace('<receiver', '</provider>\n        <receiver')
              with open(p, 'w') as f:
                  f.write(content)
              print('AndroidManifest provider tag repaired!')
          "

          # 4. Gradlew calistirma yetkisi ver
          chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermoBot-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
