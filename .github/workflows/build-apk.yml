name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean Unused Dependencies
        run: |
          npm pkg delete dependencies.framer-motion dependencies.motion 2>/dev/null || true

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Add Android Platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK and Fix Dependencies
        run: |
          # 1. SDK yolunu belirle
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          
          # 2. Androidx surumlerini SDK 34/35 uyumlu kararlı surumlere esitle
          cat << 'EOF' > android/variables.gradle
          ext {
              minSdkVersion = 24
              compileSdkVersion = 35
              targetSdkVersion = 34
              androidxActivityVersion = '1.9.0'
              androidxAppCompatVersion = '1.7.0'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.13.1'
              androidxFragmentVersion = '1.7.1'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.11.0'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.2.0'
              androidxEspressoCoreVersion = '3.6.1'
              cordovaAndroidVersion = '10.1.1'
          }
          EOF

          # 3. AndroidManifest dosyasindaki eksik provider kapanis etiketini onar
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f:
              content = f.read()
          if '<provider' in content and '</provider>' not in content:
              content = content.replace('<receiver', '</provider>\n        <receiver')
              with open(p, 'w') as f:
                  f.write(content)
              print('AndroidManifest provider tag repaired!')
          "

          # 4. Kotlin duplicate class çakışmasını gider
          python3 -c "
          p = 'android/app/build.gradle'
          with open(p, 'r') as f:
              c = f.read()
          if 'kotlin-stdlib-jdk7' not in c:
              c += '''
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          '''
              with open(p, 'w') as f:
                  f.write(c)
              print('Kotlin duplicate check fixed in build.gradle!')
          "

          # 5. Eksik metadata dizinlerini olustur (AAR hatasini onler)
          mkdir -p node_modules/@capacitor/android/capacitor/build/intermediates/aar_metadata_check/debug/checkDebugAarMetadata 2>/dev/null || true
          mkdir -p android/capacitor-android/build/intermediates/aar_metadata_check/debug/checkDebugAarMetadata 2>/dev/null || true

          # 6. Gradlew calistirma yetkisi ver
          chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew :app:assembleDebug --no-daemon -x lint -x test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermoBot-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
