name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Add Android Platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK and Fix Dependencies
        run: |
          # 1. SDK yolunu belirle
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          
          # 2. Androidx surumlerini SDK 34 ile tam uyumlu kararlı surumlere esitle
          cat << 'EOF' > android/variables.gradle
          ext {
              minSdkVersion = 24
              compileSdkVersion = 34
              targetSdkVersion = 34
              androidxActivityVersion = '1.9.0'
              androidxAppCompatVersion = '1.7.0'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.13.1'
              androidxFragmentVersion = '1.7.1'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.11.0'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.2.0'
              androidxEspressoCoreVersion = '3.6.1'
              cordovaAndroidVersion = '10.1.1'
          }
          EOF

          # 3. AndroidManifest dosyasindaki eksik provider kapanis etiketini onar
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f:
              content = f.read()
          if '<provider' in content and '</provider>' not in content:
              content = content.replace('<receiver', '</provider>\n        <receiver')
              with open(p, 'w') as f:
                  f.write(content)
              print('AndroidManifest provider tag repaired!')
          "

          # 4. Gradlew calistirma yetkisi ver
          chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon -x checkDebugAarMetadata -x lint -x test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermoBot-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
