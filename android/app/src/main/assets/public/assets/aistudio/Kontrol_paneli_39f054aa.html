<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kontrol paneli</title>
<style>
:root{
  --h:300;--lit:.7;--pw:0;--v:62;color-scheme:dark;
  --a:hsl(var(--h) 90% 72%);--a2:hsl(var(--h) 60% 28%);--ag:hsl(var(--h) 90% 65%/.55);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:#eee;
  background:
    radial-gradient(48% 42% at 78% 40%,hsl(var(--h) 55% 48%/.38),transparent 72%),
    radial-gradient(42% 40% at 20% 78%,rgba(255,150,70,.30),transparent 72%),
    linear-gradient(215deg,#706e8e 0%,#47435a 42%,#262330 100%)}
.scene{position:fixed;left:50%;top:50%;width:760px;height:700px;margin:-350px 0 0 -380px;
  transform:scale(var(--s,1));perspective:2200px}
.dev{position:absolute;left:120px;top:90px;width:520px;height:520px;transform-style:preserve-3d;
  transform:none}
.ly{position:absolute;inset:0;border-radius:58px;transform-style:preserve-3d}
.sh{transform:translate(26px,64px) scale(.96);background:#000;filter:blur(38px);opacity:.6}
.wm{transform:translate(-70px,56px) scale(.9);background:rgba(255,140,60,.7);filter:blur(55px);opacity:calc(var(--lit)*.75)}
.l3{transform:translateY(26px);background:#15131b;border:1.5px solid #3b3846}
.l2{transform:translateY(15px);border:1.5px solid hsl(var(--h) 70% 60%/.5);
  background:linear-gradient(135deg,#2a1546,hsl(var(--h) 55% 36%));box-shadow:0 0 50px hsl(var(--h) 90% 60%/calc(var(--lit)*.5))}
.l1{transform:translateY(6px);background:#1b1a21;border:1.5px solid #46424f}
.top{background:linear-gradient(145deg,#3c3a46,#23222a 58%,#1b1a21);border:1.5px solid rgba(255,255,255,.14);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.2),inset 0 0 70px rgba(0,0,0,.35),inset -40px -40px 90px hsl(var(--h) 70% 40%/.2)}
.top::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(70% 16% at 50% 50%,hsl(var(--h) 90% 60%/calc(.08 + var(--pw)*.28)),transparent 75%),
             linear-gradient(120deg,rgba(255,255,255,.13),transparent 32%,transparent 72%,rgba(255,255,255,.05))}
.o{position:absolute;transform-style:preserve-3d}

/* düğmeler: yükseklik + ışık yansıması */
.b{position:absolute;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;
  border:1px solid rgba(255,255,255,.16);cursor:pointer;font:inherit;font-size:16px;font-weight:600;color:#cfc9da;
  transition:transform .12s;box-shadow:var(--side);--side:0 8px 0 #0c0b10,0 14px 20px rgba(0,0,0,.65);
  background:linear-gradient(172deg,rgba(255,255,255,.26),rgba(255,255,255,0) 46%),#2b2932}

.b:active{transform:translateY(5px);--side:0 3px 0 #0c0b10,0 6px 10px rgba(0,0,0,.6)}
.b:focus-visible,.knob:focus-visible,.rail:focus-visible{outline:2px solid var(--a);outline-offset:4px}
.lit{color:#ffe3ff;text-shadow:0 0 4px #fff9,0 0 12px var(--a),0 0 24px var(--a);
  background:linear-gradient(172deg,rgba(255,255,255,.2),rgba(255,255,255,0) 42%),
             radial-gradient(60% 130% at 50% 60%,hsl(var(--h) 85% 50%/.55),transparent 75%),#27252e;
  box-shadow:var(--side),0 0 30px hsl(var(--h) 90% 60%/.28)}
.warm{color:#ffe2c2;text-shadow:0 0 4px #fff9,0 0 12px #ff9a4a,0 0 24px #ff8a3a;
  background:linear-gradient(172deg,rgba(255,255,255,.2),rgba(255,255,255,0) 42%),
             radial-gradient(70% 130% at 50% 60%,rgba(255,140,60,.5),transparent 75%),#2b2830;
  box-shadow:var(--side),0 0 34px rgba(255,150,70,.4)}
.go{left:36px;top:226px;width:448px;height:88px;justify-content:space-between;padding:0 34px;font-size:28px;font-weight:800;color:#fff;
  text-shadow:0 0 14px rgba(255,255,255,.45);
  background:linear-gradient(172deg,rgba(255,255,255,.4),rgba(255,255,255,0) 52%),
             linear-gradient(100deg,hsl(var(--h) 60% 16%) 0%,hsl(var(--h) 55% 30%) 42%,hsl(var(--h) 92% 68%) 100%);
  box-shadow:var(--side),0 0 46px hsl(var(--h) 90% 60%/calc(.12 + var(--pw)*.45));transition:filter .3s,transform .12s}
.dev:not(.on) .go{filter:saturate(.55) brightness(.8)}
.go svg{width:34px;height:34px;fill:#fff;filter:drop-shadow(0 0 8px #fff8)}
.disp{left:150px;top:146px;width:334px;height:54px;justify-content:space-between;padding:0 26px;border-radius:27px;cursor:default;
  font-size:15px;font-weight:500;letter-spacing:.06em;color:var(--a);text-shadow:0 0 10px var(--ag);
  background:linear-gradient(172deg,rgba(255,255,255,.14),transparent 40%),#2a2733}
.disp,.disp:active{transform:none;--side:0 5px 0 #0c0b10,0 10px 16px rgba(0,0,0,.55)}

/* döner düğmeler */
.knob{position:absolute;width:78px;height:78px;border-radius:50%;cursor:ns-resize;touch-action:none;
  box-shadow:0 14px 22px rgba(0,0,0,.65),0 0 0 2px #0a090d;
  background:repeating-conic-gradient(#0b0a0f 0 4deg,#5d5663 4deg 8deg)}
.knob::before,.knob::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(#0b0a0f 0 4deg,#4d4753 4deg 8deg)}
.knob::before{transform:translateZ(-22px);box-shadow:0 16px 24px rgba(0,0,0,.7)}
.knob::before,.knob::after{display:none}
.cap{position:absolute;inset:8px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#4c4954,#18171d 72%);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.28),inset 0 -5px 9px rgba(0,0,0,.65)}
.dial{position:absolute;inset:0;transform:rotate(var(--r,0deg))}
.dial::after{content:"";position:absolute;left:50%;top:5px;width:3px;height:9px;margin-left:-1.5px;border-radius:2px;background:var(--a);box-shadow:0 0 8px var(--a)}
.cap svg{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px);fill:none;stroke:#e6dcf4;stroke-width:2;stroke-linecap:round;opacity:.9}
.k1 .cap{box-shadow:inset 0 2px 3px rgba(255,255,255,.28),inset 0 -5px 9px rgba(0,0,0,.65),0 0 calc(10px + var(--lit)*22px) rgba(255,170,110,calc(var(--lit)*.6))}
.k1 svg{stroke:#ffd9bd;filter:drop-shadow(0 0 6px #ff9a5a)}

/* ilerleme çizgisi */
.rail{left:40px;top:340px;width:440px;height:30px;cursor:pointer;touch-action:none}
.rail *{pointer-events:none}
.rail i{position:absolute;left:0;right:0;top:13px;height:4px;border-radius:2px;background:#0b0a0f;box-shadow:0 1px 0 rgba(255,255,255,.12)}
.rail u{position:absolute;left:0;top:13px;height:4px;border-radius:2px;width:calc(var(--v)*1%);text-decoration:none;
  background:linear-gradient(90deg,hsl(var(--h) 60% 36%),var(--a));box-shadow:0 0 12px var(--a),0 0 28px var(--ag)}
.rail s{position:absolute;top:8px;left:calc(var(--v)*1% - 7px);width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 14px var(--a)}
.lbl{left:42px;top:376px;font-size:14px;color:var(--a);text-shadow:0 0 10px var(--ag);letter-spacing:.05em}
.led{left:440px;top:62px;width:24px;height:24px;border-radius:50%;border:3px solid #55505f;transition:.3s}
.dev.on .led{border-color:var(--a);box-shadow:0 0 14px var(--a),inset 0 0 8px var(--ag)}
.bar{left:300px;top:428px;width:6px;height:38px;border-radius:3px;background:#575262;transition:.3s}
.dev.loop .bar{background:var(--a);box-shadow:0 0 14px var(--a)}
.sq{width:14px;height:14px;border:2px solid currentColor;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="dev" id="dev">
    <div class="ly sh"></div><div class="ly wm"></div><div class="ly l3"></div><div class="ly l2"></div><div class="ly l1"></div>
    <div class="ly top">
      <div class="knob k1" style="left:40px;top:44px" data-k="bright" role="slider" tabindex="0" aria-label="Parlaklık" aria-valuemin="0" aria-valuemax="100">
        <div class="cap"><div class="dial"></div><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="9"/><circle cx="16" cy="16" r="3.5"/></svg></div></div>
      <div class="knob" style="left:140px;top:44px" data-k="speed" role="slider" tabindex="0" aria-label="Hız" aria-valuemin="0" aria-valuemax="100">
        <div class="cap"><div class="dial"></div><svg viewBox="0 0 32 32"><path d="M16 26C6 19 5 11 10 8c3-1.600 5 .5 6 3 1-2.500 3-4.600 6-3 5 3 4 11-6 18z"/></svg></div></div>
      <div class="knob" style="left:240px;top:44px" data-k="hue" role="slider" tabindex="0" aria-label="Renk" aria-valuemin="0" aria-valuemax="100">
        <div class="cap"><div class="dial"></div><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="10"/><circle cx="16" cy="16" r="5.500"/><path d="M16 11v10"/></svg></div></div>
      <div class="o led"></div>

      <button class="b warm" id="reset" style="left:36px;top:152px;width:96px;height:46px;font-size:15px" type="button">Sıfırla</button>
      <div class="b disp"><span id="st">Hazır</span><span id="vl">62%</span></div>

      <button class="b go" id="go" type="button"><span id="gl">Aç</span>
        <svg viewBox="0 0 24 24" id="gi"><path d="M6 3.500v17l15-8.500z"/></svg></button>

      <div class="o rail" id="rail" tabindex="0" role="slider" aria-label="Seviye" aria-valuemin="0" aria-valuemax="100"><i></i><u></u><s></s></div>
      <div class="o lbl" id="lb">Seviye 62</div>

      <button class="b lit" id="back" style="left:36px;top:424px;width:104px;height:48px" type="button">Geri</button>
      <button class="b lit" id="fwd" style="left:154px;top:424px;width:104px;height:48px" type="button">İleri</button>
      <div class="o bar"></div>
      <button class="b" id="loop" style="left:372px;top:424px;width:112px;height:46px;font-size:14px" type="button"><span class="sq"></span>Döngü</button>
    </div>
  </div>
</div>
<script>
(function(){
  var S={bright:70,speed:50,hue:65,level:62,on:false,loop:true},D={bright:70,speed:50,hue:65,level:62};
  var root=document.documentElement,dev=document.getElementById('dev'),$=function(i){return document.getElementById(i)};
  var knobs=[].slice.call(document.querySelectorAll('.knob')),names={bright:'Parlaklık',speed:'Hız',hue:'Renk'},tmp=0;
  function cl(v){return Math.max(0,Math.min(100,v))}
  function paint(){
    root.style.setProperty('--h',190+S.hue*1.7);
    root.style.setProperty('--lit',.25+S.bright/100*.95);
    root.style.setProperty('--v',S.level);
    root.style.setProperty('--pw',S.on?1:0);
    dev.classList.toggle('on',S.on);dev.classList.toggle('loop',S.loop);
    knobs.forEach(function(k){var n=k.dataset.k;k.querySelector('.dial').style.setProperty('--r',(-135+S[n]*2.7)+'deg');k.setAttribute('aria-valuenow',Math.round(S[n]))});
    $('rail').setAttribute('aria-valuenow',Math.round(S.level));
    $('gl').textContent=S.on?'Kapat':'Aç';
    $('gi').innerHTML=S.on?'<path d="M6 4h4.500v16H6zM13.500 4H18v16h-4.500z"/>':'<path d="M6 3.500v17l15-8.500z"/>';
    $('lb').textContent='Seviye '+Math.round(S.level);
    $('loop').setAttribute('aria-pressed',S.loop);
    if(!tmp){$('st').textContent=S.on?'Çalışıyor':'Hazır';$('vl').textContent=Math.round(S.level)+'%'}
  }
  function flash(n){tmp=1;$('st').textContent=names[n];$('vl').textContent=Math.round(S[n]);clearTimeout(flash.t);flash.t=setTimeout(function(){tmp=0;paint()},1100)}

  knobs.forEach(function(k){
    var n=k.dataset.k,y0,v0;
    k.addEventListener('pointerdown',function(e){k.setPointerCapture(e.pointerId);y0=e.clientY;v0=S[n]});
    k.addEventListener('pointermove',function(e){if(!k.hasPointerCapture(e.pointerId))return;S[n]=cl(v0+(y0-e.clientY)*.5);paint();flash(n)});
    k.addEventListener('wheel',function(e){e.preventDefault();S[n]=cl(S[n]-e.deltaY*.05);paint();flash(n)},{passive:false});
    k.addEventListener('keydown',function(e){var d={ArrowUp:5,ArrowRight:5,ArrowDown:-5,ArrowLeft:-5}[e.key];if(d){e.preventDefault();S[n]=cl(S[n]+d);paint();flash(n)}});
  });

  var rail=$('rail');
  function seek(e){S.level=cl(e.offsetX/rail.offsetWidth*100);paint()}
  rail.addEventListener('pointerdown',function(e){rail.setPointerCapture(e.pointerId);seek(e)});
  rail.addEventListener('pointermove',function(e){if(rail.hasPointerCapture(e.pointerId))seek(e)});
  rail.addEventListener('keydown',function(e){var d={ArrowRight:5,ArrowLeft:-5}[e.key];if(d){S.level=cl(S.level+d);paint()}});

  $('go').onclick=function(){S.on=!S.on;paint()};
  $('back').onclick=function(){S.level=cl(S.level-10);paint()};
  $('fwd').onclick=function(){S.level=cl(S.level+10);paint()};
  $('loop').onclick=function(){S.loop=!S.loop;paint()};
  $('reset').onclick=function(){for(var k in D)S[k]=D[k];S.on=false;paint()};

  setInterval(function(){
    if(!S.on)return;
    S.level+=.15+S.speed/100*.9;
    if(S.level>=100){if(S.loop)S.level=0;else{S.level=100;S.on=false}}
    paint();
  },100);

  function fit(){document.getElementById('scene').style.setProperty('--s',Math.min(1.2,innerWidth/660,innerHeight/660))}
  addEventListener('resize',fit);fit();paint();
})();
</script>
</body>
</html>
